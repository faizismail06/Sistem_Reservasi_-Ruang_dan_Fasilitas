services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reservasi
      POSTGRES_PASSWORD: reservasi_local
      POSTGRES_DB: reservasi
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - reservasi_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reservasi']
      interval: 5s
      retries: 10
volumes:
  reservasi_data:
